# Ambiente local completo: n8n (orquestrador) + API do agente (cérebro).
#
#   docker compose up -d --build
#   n8n:  http://localhost:5678      API: http://localhost:8000/docs
#
# Dentro da rede do compose, o n8n chama a API por http://api:8000 (nome do serviço).
# As portas ficam presas em 127.0.0.1: nada fica exposto na rede local. Para o
# Telegram alcançar o webhook do n8n, usamos um túnel (cloudflared) apontando para :5678.

name: ia-agent

services:
  api:
    build: .
    env_file: .env                       # LLM_PROVEDOR, LLM_MODELO, OPENAI_*, API_TOKEN
    environment:
      BANCO_CAMINHO: /app/dados/atendimento.db
    volumes:
      - api_dados:/app/dados             # SQLite sobrevive a rebuilds do container
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.3   # versão fixa: workflows exportados dependem dela
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo   # fuso dos Schedule Triggers (lembrete 18h)
      TZ: America/Sao_Paulo
      N8N_HOST: localhost
      N8N_PORT: "5678"
      # URL pública que o n8n informa ao Telegram ao registrar o webhook.
      # Vem do .env (interpolação do compose), gravada por scripts/tunel.ps1.
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      # O editor (e o callback do OAuth do Google) fica SEMPRE em localhost: sem isto o n8n
      # deriva a URL do editor do webhook (túnel), que bloqueia /rest/* e muda a cada start.
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_PROXY_HOPS: "1"                # há um proxy (nginx) na frente dos webhooks
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Configuração dos workflows via $env, para o JSON versionado não ter IDs pessoais.
      # Liberar $env é aceitável aqui: este container não recebe nenhum segredo por env
      # (tokens e OAuth ficam cifrados nas credenciais do n8n).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DONO_TELEGRAM_CHAT_ID: ${DONO_TELEGRAM_CHAT_ID:-}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}   # formato e-mail; "primary" NÃO é aceito pelo nó
    volumes:
      - n8n_data:/home/node/.n8n         # workflows, credenciais e chave de criptografia
      - ./n8n/workflows:/workflows:ro    # workflows versionados no Git (scripts/importar_n8n.ps1)
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Túnel público (só com: docker compose --profile tunel ...) ----------
  # Use scripts/tunel.ps1: ele sobe o túnel, descobre a URL e atualiza o WEBHOOK_URL.

  webhook-proxy:                         # deixa passar só /webhook/*; o editor fica privado
    image: nginx:1.31.9-alpine
    profiles: [tunel]
    volumes:
      - ./n8n/proxy-webhook.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n
    restart: unless-stopped

  cloudflared:                           # quick tunnel: HTTPS grátis, sem conta, URL muda a cada start
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunel]
    command: tunnel --no-autoupdate --url http://webhook-proxy:80
    depends_on:
      - webhook-proxy
    # Sem restart automático de propósito: um restart silencioso geraria uma URL nova
    # que o Telegram não conhece. Melhor o túnel cair e o script ser rodado de novo.
    restart: "no"

volumes:
  api_dados:
  n8n_data:
