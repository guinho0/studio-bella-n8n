# Porta de entrada pública (via cloudflared). Só passam as rotas de webhook:
# o editor do n8n (login, API REST) NÃO fica exposto na internet.
server {
    listen 80;

    # Produção: é aqui que o Telegram entrega as mensagens.
    location /webhook/ {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Teste: usado pelo botão "Listen for test event" do editor.
    location /webhook-test/ {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
